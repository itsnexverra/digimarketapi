<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logo-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="logo-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#06b6d2" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="logo-grad-3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#081225" stop-opacity="1" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="1" />
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="44" stroke="url(#logo-grad-1)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
  
  <!-- Hexagonal Isometric Base Frame -->
  <path d="M50 12 L82 30.5 V67.5 L50 86 L18 67.5 V30.5 Z" fill="url(#logo-grad-3)" stroke="url(#logo-grad-1)" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Overlapping inner facets creating 3D layout -->
  <path d="M50 12 L82 30.5 L50 50 Z" fill="url(#logo-grad-2)" opacity="0.9" />
  <path d="M50 50 L82 67.5 L50 86 Z" fill="url(#logo-grad-1)" opacity="0.95" />
  <path d="M18 30.5 L50 50 L18 67.5 Z" fill="url(#logo-grad-2)" opacity="0.8" />
  
  <!-- Core Neural Light Node -->
  <circle cx="50" cy="50" r="9" fill="#ffffff" filter="url(#glow-filter)" />
  <circle cx="50" cy="50" r="4.5" fill="#22d3ee" />
</svg>
